<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<style>

html, body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}


canvas {
    width:100%;
    height:100%;
}

.nav-zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 15%;
    display: flex;
    align-items: center;
    z-index: 9997;
}

.nav-zone-left {
    left: 0;
    justify-content: flex-start;
}

.nav-zone-right {
    right: 0;
    justify-content: flex-end;
}

.nav-arrow {
    margin: 0 12px;
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    font-size: 28px;
    font-family: sans-serif;
    line-height: 56px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease;
}

.nav-zone:hover .nav-arrow {
    opacity: 1;
}

.nav-arrow:hover {
    background: rgba(0, 0, 0, 0.65);
}

</style>

</head>


<body>


<canvas id="canvas"></canvas>

<div class="nav-zone nav-zone-left">
    <button id="nav-prev" class="nav-arrow" aria-label="Previous preset">&#10094;</button>
</div>

<div class="nav-zone nav-zone-right">
    <button id="nav-next" class="nav-arrow" aria-label="Next preset">&#10095;</button>
</div>


<script type="module" src="./main.js"></script>


</body>

</html>
